<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title description"><title id="title">AI-enabled SDLC assurance: management controls and independent tests</title><desc id="description">Six management control domains each mapped vertically to an independent assurance test, with three categories of control boundaries.</desc><style>.title{font:800 49px system-ui,sans-serif;fill:#0d2b58}.subtitle{font:23px system-ui,sans-serif;fill:#4d6177}.header{font:800 25px system-ui,sans-serif;fill:#123c71}.boxlabel{font:700 23px system-ui,sans-serif;fill:#15355f}.meta{font:18px system-ui,sans-serif;fill:#3e617e}.footer{font:700 23px system-ui,sans-serif}.footnote{font:18px system-ui,sans-serif;fill:#4d6177}</style><rect width="1600" height="840" fill="#ffffff"/><rect x="45" y="32" width="94" height="9" rx="5" fill="#1673db"/><text x="45" y="93" class="title">AI-enabled CI/CD: Technical Assurance</text><text x="45" y="132" class="subtitle">Six management controls mapped directly to independent validation.</text><rect x="45" y="154" width="1490" height="43" rx="10" fill="#e8f2ff"/><text x="790" y="182" text-anchor="middle" class="header">Management configures and operates safeguards. Assurance challenges whether they work.</text><g><rect x="45" y="205" width="232" height="155" rx="14" fill="#eef6ff" stroke="#8db7dc"/><text x="161" y="245" class="boxlabel" text-anchor="middle">Governance</text><text x="161" y="272" class="boxlabel" text-anchor="middle">&amp; scope</text><text x="161" y="330" class="meta" text-anchor="middle">Management control 1</text><path d="M161 360 V413" stroke="#3a76ad" stroke-width="3" stroke-dasharray="5 5"/><path d="M153 404 l8 11 8 -11" fill="none" stroke="#3a76ad" stroke-width="3"/><rect x="45" y="425" width="232" height="155" rx="14" fill="#f5fbff" stroke="#8db7dc"/><text x="161" y="466" class="boxlabel" text-anchor="middle">Population</text><text x="161" y="493" class="boxlabel" text-anchor="middle">coverage</text><text x="161" y="549" class="meta" text-anchor="middle">Independent test 1</text></g><g><rect x="295" y="205" width="232" height="155" rx="14" fill="#eef6ff" stroke="#8db7dc"/><text x="411" y="245" class="boxlabel" text-anchor="middle">Agent security</text><text x="411" y="272" class="boxlabel" text-anchor="middle">&amp; configuration</text><text x="411" y="330" class="meta" text-anchor="middle">Management control 2</text><path d="M411 360 V413" stroke="#3a76ad" stroke-width="3" stroke-dasharray="5 5"/><path d="M403 404 l8 11 8 -11" fill="none" stroke="#3a76ad" stroke-width="3"/><rect x="295" y="425" width="232" height="155" rx="14" fill="#f5fbff" stroke="#8db7dc"/><text x="411" y="466" class="boxlabel" text-anchor="middle">Access &amp;</text><text x="411" y="493" class="boxlabel" text-anchor="middle">abuse tests</text><text x="411" y="549" class="meta" text-anchor="middle">Independent test 2</text></g><g><rect x="545" y="205" width="232" height="155" rx="14" fill="#eef6ff" stroke="#8db7dc"/><text x="661" y="245" class="boxlabel" text-anchor="middle">Deterministic</text><text x="661" y="272" class="boxlabel" text-anchor="middle">policy</text><text x="661" y="330" class="meta" text-anchor="middle">Management control 3</text><path d="M661 360 V413" stroke="#3a76ad" stroke-width="3" stroke-dasharray="5 5"/><path d="M653 404 l8 11 8 -11" fill="none" stroke="#3a76ad" stroke-width="3"/><rect x="545" y="425" width="232" height="155" rx="14" fill="#e0efff" stroke="#8db7dc"/><text x="661" y="466" class="boxlabel" text-anchor="middle">Negative</text><text x="661" y="493" class="boxlabel" text-anchor="middle">testing</text><text x="661" y="549" class="meta" text-anchor="middle">Independent test 3</text></g><g><rect x="795" y="205" width="232" height="155" rx="14" fill="#eef6ff" stroke="#8db7dc"/><text x="911" y="245" class="boxlabel" text-anchor="middle">AI evaluation</text><text x="911" y="272" class="boxlabel" text-anchor="middle">&amp; validation</text><text x="911" y="330" class="meta" text-anchor="middle">Management control 4</text><path d="M911 360 V413" stroke="#3a76ad" stroke-width="3" stroke-dasharray="5 5"/><path d="M903 404 l8 11 8 -11" fill="none" stroke="#3a76ad" stroke-width="3"/><rect x="795" y="425" width="232" height="155" rx="14" fill="#f5fbff" stroke="#8db7dc"/><text x="911" y="466" class="boxlabel" text-anchor="middle">Classification</text><text x="911" y="493" class="boxlabel" text-anchor="middle">testing</text><text x="911" y="549" class="meta" text-anchor="middle">Independent test 4</text></g><g><rect x="1045" y="205" width="232" height="155" rx="14" fill="#eef6ff" stroke="#8db7dc"/><text x="1161" y="245" class="boxlabel" text-anchor="middle">Authorization</text><text x="1161" y="272" class="boxlabel" text-anchor="middle">&amp; deployment</text><text x="1161" y="330" class="meta" text-anchor="middle">Management control 5</text><path d="M1161 360 V413" stroke="#3a76ad" stroke-width="3" stroke-dasharray="5 5"/><path d="M1153 404 l8 11 8 -11" fill="none" stroke="#3a76ad" stroke-width="3"/><rect x="1045" y="425" width="232" height="155" rx="14" fill="#e0efff" stroke="#8db7dc"/><text x="1161" y="466" class="boxlabel" text-anchor="middle">End-to-end</text><text x="1161" y="493" class="boxlabel" text-anchor="middle">reperformance</text><text x="1161" y="549" class="meta" text-anchor="middle">Independent test 5</text></g><g><rect x="1295" y="205" width="232" height="155" rx="14" fill="#eef6ff" stroke="#8db7dc"/><text x="1411" y="245" class="boxlabel" text-anchor="middle">Monitoring</text><text x="1411" y="272" class="boxlabel" text-anchor="middle">&amp; response</text><text x="1411" y="330" class="meta" text-anchor="middle">Management control 6</text><path d="M1411 360 V413" stroke="#3a76ad" stroke-width="3" stroke-dasharray="5 5"/><path d="M1403 404 l8 11 8 -11" fill="none" stroke="#3a76ad" stroke-width="3"/><rect x="1295" y="425" width="232" height="155" rx="14" fill="#f5fbff" stroke="#8db7dc"/><text x="1411" y="466" class="boxlabel" text-anchor="middle">Operating</text><text x="1411" y="493" class="boxlabel" text-anchor="middle">effectiveness</text><text x="1411" y="549" class="meta" text-anchor="middle">Independent test 6</text></g><text x="45" y="630" class="header">Control boundaries</text><g><rect x="45" y="656" width="478" height="90" rx="12" fill="#e7f8f0" stroke="#59bb95"/><text x="68" y="688" class="footer" fill="#115d46">Directly controlled</text><text x="68" y="721" class="footnote">Policy, access, enforcement, evidence</text><rect x="543" y="656" width="479" height="90" rx="12" fill="#fff5e1" stroke="#dea34a"/><text x="566" y="688" class="footer" fill="#825111">Governed or monitored</text><text x="566" y="721" class="footnote">Model use, updates, agent behavior</text><rect x="1042" y="656" width="493" height="90" rx="12" fill="#fff0f0" stroke="#d88b91"/><text x="1065" y="688" class="footer" fill="#9b2637">Outside direct control</text><text x="1065" y="721" class="footnote">Provider models and infrastructure</text></g><text x="45" y="799" class="footnote">Illustrative reference map. No live testing, implementation or control-effectiveness conclusion is implied.</text></svg>