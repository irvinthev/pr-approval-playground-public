<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title description"><title id="title">AI-enabled SDLC assurance: management controls and independent tests</title><desc id="description">Six management control domains and related independent test themes, three cross-cutting assurance requirements, and three categories of control boundaries. Proposed links to the 15-control RCM are described in the interactive Assurance page.</desc><style>.title{font:800 49px system-ui,sans-serif;fill:#0d2b58}.subtitle{font:23px system-ui,sans-serif;fill:#4d6177}.header{font:800 25px system-ui,sans-serif;fill:#123c71}.boxlabel{font:700 23px system-ui,sans-serif;fill:#15355f}.meta{font:18px system-ui,sans-serif;fill:#3e617e}.footer{font:700 23px system-ui,sans-serif}.footnote{font:18px system-ui,sans-serif;fill:#4d6177}</style><rect width="1600" height="840" fill="#ffffff"/><rect x="45" y="32" width="94" height="9" rx="5" fill="#1673db"/><text x="45" y="93" class="title">AI-enabled CI/CD: Technical Assurance</text><text x="45" y="132" class="subtitle">Six control domains, independent challenge, and cross-cutting assurance.</text><rect x="45" y="154" width="1490" height="43" rx="10" fill="#e8f2ff"/><text x="790" y="182" text-anchor="middle" class="header">Management operates safeguards. Assurance challenges whether they work.</text><g><rect x="45" y="205" width="232" height="155" rx="14" fill="#eef6ff" stroke="#8db7dc"/><text x="161" y="245" class="boxlabel" text-anchor="middle">Governance</text><text x="161" y="272" class="boxlabel" text-anchor="middle">&amp; scope</text><text x="161" y="330" class="meta" text-anchor="middle">Control domain 1</text><path d="M161 360 V413" stroke="#3a76ad" stroke-width="3" stroke-dasharray="5 5"/><path d="M153 404 l8 11 8 -11" fill="none" stroke="#3a76ad" stroke-width="3"/><rect x="45" y="425" width="232" height="155" rx="14" fill="#f5fbff" stroke="#8db7dc"/><text x="161" y="466" class="boxlabel" text-anchor="middle">Population</text><text x="161" y="493" class="boxlabel" text-anchor="middle">coverage</text><text x="161" y="549" class="meta" text-anchor="middle">Test theme 1</text></g><g><rect x="295" y="205" width="232" height="155" rx="14" fill="#eef6ff" stroke="#8db7dc"/><text x="411" y="245" class="boxlabel" text-anchor="middle">Agent security</text><text x="411" y="272" class="boxlabel" text-anchor="middle">&amp; configuration</text><text x="411" y="330" class="meta" text-anchor="middle">Control domain 2</text><path d="M411 360 V413" stroke="#3a76ad" stroke-width="3" stroke-dasharray="5 5"/><path d="M403 404 l8 11 8 -11" fill="none" stroke="#3a76ad" stroke-width="3"/><rect x="295" y="425" width="232" height="155" rx="14" fill="#f5fbff" stroke="#8db7dc"/><text x="411" y="466" class="boxlabel" text-anchor="middle">Access &amp;</text><text x="411" y="493" class="boxlabel" text-anchor="middle">abuse tests</text><text x="411" y="549" class="meta" text-anchor="middle">Test theme 2</text></g><g><rect x="545" y="205" width="232" height="155" rx="14" fill="#eef6ff" stroke="#8db7dc"/><text x="661" y="245" class="boxlabel" text-anchor="middle">Deterministic</text><text x="661" y="272" class="boxlabel" text-anchor="middle">policy</text><text x="661" y="330" class="meta" text-anchor="middle">Control domain 3</text><path d="M661 360 V413" stroke="#3a76ad" stroke-width="3" stroke-dasharray="5 5"/><path d="M653 404 l8 11 8 -11" fill="none" stroke="#3a76ad" stroke-width="3"/><rect x="545" y="425" width="232" height="155" rx="14" fill="#e0efff" stroke="#8db7dc"/><text x="661" y="466" class="boxlabel" text-anchor="middle">Negative</text><text x="661" y="493" class="boxlabel" text-anchor="middle">testing</text><text x="661" y="549" class="meta" text-anchor="middle">Test theme 3</text></g><g><rect x="795" y="205" width="232" height="155" rx="14" fill="#eef6ff" stroke="#8db7dc"/><text x="911" y="245" class="boxlabel" text-anchor="middle">AI evaluation</text><text x="911" y="272" class="boxlabel" text-anchor="middle">&amp; validation</text><text x="911" y="330" class="meta" text-anchor="middle">Control domain 4</text><path d="M911 360 V413" stroke="#3a76ad" stroke-width="3" stroke-dasharray="5 5"/><path d="M903 404 l8 11 8 -11" fill="none" stroke="#3a76ad" stroke-width="3"/><rect x="795" y="425" width="232" height="155" rx="14" fill="#f5fbff" stroke="#8db7dc"/><text x="911" y="466" class="boxlabel" text-anchor="middle">Classification</text><text x="911" y="493" class="boxlabel" text-anchor="middle">testing</text><text x="911" y="549" class="meta" text-anchor="middle">Test theme 4</text></g><g><rect x="1045" y="205" width="232" height="155" rx="14" fill="#eef6ff" stroke="#8db7dc"/><text x="1161" y="245" class="boxlabel" text-anchor="middle">Authorization</text><text x="1161" y="272" class="boxlabel" text-anchor="middle">&amp; release</text><text x="1161" y="330" class="meta" text-anchor="middle">Control domain 5</text><path d="M1161 360 V413" stroke="#3a76ad" stroke-width="3" stroke-dasharray="5 5"/><path d="M1153 404 l8 11 8 -11" fill="none" stroke="#3a76ad" stroke-width="3"/><rect x="1045" y="425" width="232" height="155" rx="14" fill="#e0efff" stroke="#8db7dc"/><text x="1161" y="466" class="boxlabel" text-anchor="middle">End-to-end</text><text x="1161" y="493" class="boxlabel" text-anchor="middle">reperformance</text><text x="1161" y="549" class="meta" text-anchor="middle">Test theme 5</text></g><g><rect x="1295" y="205" width="232" height="155" rx="14" fill="#eef6ff" stroke="#8db7dc"/><text x="1411" y="245" class="boxlabel" text-anchor="middle">Monitoring</text><text x="1411" y="272" class="boxlabel" text-anchor="middle">&amp; response</text><text x="1411" y="330" class="meta" text-anchor="middle">Control domain 6</text><path d="M1411 360 V413" stroke="#3a76ad" stroke-width="3" stroke-dasharray="5 5"/><path d="M1403 404 l8 11 8 -11" fill="none" stroke="#3a76ad" stroke-width="3"/><rect x="1295" y="425" width="232" height="155" rx="14" fill="#f5fbff" stroke="#8db7dc"/><text x="1411" y="466" class="boxlabel" text-anchor="middle">Operating</text><text x="1411" y="493" class="boxlabel" text-anchor="middle">effectiveness</text><text x="1411" y="549" class="meta" text-anchor="middle">Test theme 6</text></g><g aria-label="Three cross-cutting assurance requirements">
<rect x="45" y="606" width="1490" height="294" rx="16" fill="#f1efff" stroke="#b7b8f8" stroke-width="2"/>
<text x="790" y="647" text-anchor="middle" class="header">Cross-cutting assurance requirements</text>
<rect x="62" y="668" width="466" height="204" rx="12" fill="#faf9ff" stroke="#b6b8f5"/>
<rect x="550" y="668" width="466" height="204" rx="12" fill="#faf9ff" stroke="#b6b8f5"/>
<rect x="1038" y="668" width="478" height="204" rx="12" fill="#faf9ff" stroke="#b6b8f5"/>
<g fill="#172e64" font-family="system-ui,sans-serif"><text x="82" y="706" font-size="24" font-weight="800">Change Management</text>
<text x="82" y="749" font-size="19">Authorized and traceable changes to</text><text x="82" y="776" font-size="19">safeguards, policies, prompts,</text><text x="82" y="803" font-size="19">models, permissions and gates.</text>
<text x="570" y="706" font-size="24" font-weight="800">Testing &amp; Validation</text>
<text x="570" y="749" font-size="19">Positive, negative, adversarial,</text><text x="570" y="776" font-size="19">integration and regression tests</text><text x="570" y="803" font-size="19">before and after material changes.</text>
<text x="1058" y="706" font-size="24" font-weight="800">Operating Effectiveness</text>
<text x="1058" y="749" font-size="19">Evidence across the relevant period:</text><text x="1058" y="776" font-size="19">complete populations, exceptions,</text><text x="1058" y="803" font-size="19">changes, responses and outcomes.</text></g>
</g><text x="45" y="962" class="header">Control boundaries</text><g><rect x="45" y="988" width="478" height="90" rx="12" fill="#e7f8f0" stroke="#59bb95"/><text x="68" y="1020" class="footer" fill="#115d46">Directly controlled</text><text x="68" y="1053" class="footnote">Policy, access, enforcement, evidence</text><rect x="543" y="988" width="479" height="90" rx="12" fill="#fff5e1" stroke="#dea34a"/><text x="566" y="1020" class="footer" fill="#825111">Governed or monitored</text><text x="566" y="1053" class="footnote">Model use, updates, agent behavior</text><rect x="1042" y="988" width="493" height="90" rx="12" fill="#fff0f0" stroke="#d88b91"/><text x="1065" y="1020" class="footer" fill="#9b2637">Outside direct control</text><text x="1065" y="1053" class="footnote">Provider models and infrastructure</text></g><text x="45" y="1136" class="footnote">Illustrative assurance map. RCM domain associations are proposed; no implemented effectiveness is implied.</text></svg>