name: Vercel UX Screenshot Gallery
on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'Exact ready ai-sdlc-challenge-agent Vercel Preview URL'
        type: string
        required: true
permissions:
  contents: read
jobs:
  capture:
    # Run trusted screenshot code from the default branch, never from a PR checkout.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate Preview URL and check protected deployment access
        id: target
        env:
          UX_MANUAL_URL: ${{ inputs.preview_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/find-ready-vercel-ux-preview.mjs
      - name: Install Playwright Chromium
        if: steps.target.outputs.url != ''
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Capture Vercel-deployed desktop and iPhone UX
        if: steps.target.outputs.url != ''
        env:
          UX_PREVIEW_URL: ${{ steps.target.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/capture-preview-ux-screenshots.mjs
      - name: Upload private-fixture screenshot gallery
        id: artifact
        if: steps.target.outputs.url != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vercel-ux-${{ github.run_number }}
          path: screenshots-vercel/
          if-no-files-found: error
          retention-days: 7
      - name: Add report link to GitHub Actions summary
        if: steps.target.outputs.url != ''
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          echo '### Vercel-deployed UX gallery' >> "$GITHUB_STEP_SUMMARY"
          echo "Download the [Playwright screenshots and HTML gallery]($ARTIFACT_URL)." >> "$GITHUB_STEP_SUMMARY"
          echo 'Captured against the protected Preview with a fictional intercepted API response. This checks deployed UX, not live Gemini reasoning.' >> "$GITHUB_STEP_SUMMARY"
