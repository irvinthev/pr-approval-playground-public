name: Investigation Lab Tests
on:
  pull_request:
    paths:
      - 'lab/**'
      - '.github/workflows/lab-tests.yml'
  workflow_dispatch:
jobs:
  evaluator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify evaluator regression cases
        working-directory: lab
        run: npm test
