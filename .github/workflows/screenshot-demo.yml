name: Public site screenshot demo
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/capture-public-page.mjs'
      - '.github/workflows/screenshot-demo.yml'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Capture public pages
        run: node scripts/capture-public-page.mjs
      - name: Upload screenshots and collection metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-site-screenshots
          path: screenshots-demo/
          if-no-files-found: warn
