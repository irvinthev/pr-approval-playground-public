name: RCM Explorer Checks
on:
  pull_request:
    paths:
      - 'rcm-explorer*'
      - 'framework-registry.js'
      - 'framework-source-catalog.js'
      - 'data/framework-*.csv'
      - 'tests/framework-source-catalog.test.mjs'
      - 'tests/framework-catalog-consolidation.test.mjs'
      - 'docs/FRAMEWORK-SOURCE-LIBRARY.md'
      - 'tests/framework-registry.test.mjs'
      - 'docs/FRAMEWORK-REGISTRY-PILOT.md'
      - 'tests/rcm-explorer.test.mjs'
      - 'rcm-view.html'
      - '.github/workflows/rcm-explorer.yml'
  workflow_dispatch:
jobs:
  rcms:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS syntax
        run: |
          node --check rcm-explorer-engine.js
          node --check rcm-explorer-data.js
          node --check rcm-explorer-app.js
          node --check framework-registry.js
          node --check framework-source-catalog.js
      - name: Test scenario recommendation logic
        run: node --test tests/rcm-explorer.test.mjs
      - name: Test framework source integrity and pilot mappings
        run: node --test tests/framework-registry.test.mjs
      - name: Test source catalog schema and confidentiality boundary
        run: node --test tests/framework-source-catalog.test.mjs
      - name: Test compatibility adapter and canonical catalog parity
        run: node --test tests/framework-catalog-consolidation.test.mjs
